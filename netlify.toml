# Netlify configuration — this is a static site, nothing to build.
[build]
  publish = "."
  command = "echo 'Static site — no build step required'"

# Friendly headers for the game
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
